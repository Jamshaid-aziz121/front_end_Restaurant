name: front-end-restaurant

on:
  push:
    branches:
      - main   # change if your default branch is different
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
              
      # 4️⃣ Build Docusaurus site
      - name: Build Docusaurus site
        run: npm run build
        working-directory: frontend

      # 5️⃣ Setup GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 6️⃣ Upload artifact for deployment
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build   # <- folder created by build

      # 7️⃣ Deploy to GitHub Pages
      - name: Deploy
        uses: actions/deploy-pages@v4
